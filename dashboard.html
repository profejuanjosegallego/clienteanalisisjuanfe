<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analisis</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <section class="container mt-5">
      <a
        class="btn btn-outline-dark"
        data-bs-toggle="offcanvas"
        href="#offcanvasExample"
        role="button"
        aria-controls="offcanvasExample"
      >
        Ver analisis
      </a>
      <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasExampleLabel">Analisis</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div>
      <section class="row shadow">
        <section class="col-12 border p-4">
            <h4>Analis de ventas</h4>
        </section>
      </section>
      <section class="row my-3 shadow">
        <section class="col-12 border p-4">
            <h4>Analis de productos</h4>
        </section>
      </section>
      <section class="row my-3 shadow">
        <section class="col-12 border p-4">
            <h4>Analis de empleados</h4>
        </section>
      </section>
    </div>
    <div class="dropdown mt-3">
     
    </div>
  </div>
</div>



    </section>

    <section class="container my-5 border rounded">
        <section class="row">
            <div class="col-12 p-5">
                <h3>Generador de reportes: </h3>
            </div>
        </section>
        <section class="row my-4">
            <div class="col-4">
                <div class="card shadow p-5">
                    <h4>Numero de datos analizados: </h4>
                </div>
            </div>
            <div class="col-4">
                <div class="card shadow p-5">
                    <h4>Numero de datos correctos: </h4>
                </div>
            </div>
            <div class="col-4">
                <div class="card shadow p-5">
                    <h4>TOTAL: </h4>
                </div>
            </div>
        </section>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
